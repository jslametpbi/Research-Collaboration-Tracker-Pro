<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Premium offline-first research collaboration tracker for manuscripts, co-authors, journals, tasks, APCs, ethics, and editorial pipelines." />
  <title>JS Research Collaboration Tracker Pro</title>
  <link rel="icon" href="./favicon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./assets/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">JS</div>
        <div>
          <h1>JS Research</h1>
          <p>Collaboration Tracker Pro</p>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-card">
        <span class="mini-label">Executive owner</span>
        <strong>Dr. Joko Slamet</strong>
        <small>Cipta Wacana University</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-button mobile-only" id="menuToggle" aria-label="Open menu">☰</button>
        <div>
          <p class="eyebrow">Research Operations Suite</p>
          <h2 id="pageTitle">Dashboard</h2>
        </div>
        <div class="top-actions">
          <div class="search-wrap"><span>⌕</span><input id="globalSearch" placeholder="Search manuscripts, authors, journals..." /></div>
          <button class="ghost" id="exportJson">Export JSON</button>
          <label class="ghost file-label">Import<input type="file" id="importJson" accept="application/json" /></label>
          <button class="primary" id="quickAdd">+ New Manuscript</button>
        </div>
      </header>

      <section class="content" id="content"></section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div><p class="eyebrow">Pipeline Editor</p><h3 id="modalTitle">Add Manuscript</h3></div>
        <button class="icon-button" id="closeModal">×</button>
      </div>
      <form id="projectForm" class="form-grid">
        <input type="hidden" name="id" />
        <label>Manuscript title<input name="title" required /></label>
        <label>Target journal<input name="journal" required /></label>
        <label>Status<select name="status"><option>Drafting</option><option>Internal Review</option><option>Submitted</option><option>Major Revision</option><option>Minor Revision</option><option>Accepted</option><option>Rejected</option></select></label>
        <label>Priority<select name="priority"><option>High</option><option>Medium</option><option>Low</option></select></label>
        <label>Deadline<input name="deadline" type="date" required /></label>
        <label>APC / budget estimate<input name="apc" type="number" min="0" step="1" /></label>
        <label class="wide">Authors / collaborators<input name="authors" placeholder="Separate names with commas" /></label>
        <label class="wide">Next action<textarea name="nextAction" rows="3"></textarea></label>
        <label class="wide">Notes<textarea name="notes" rows="3"></textarea></label>
        <button class="primary wide" type="submit">Save manuscript</button>
      </form>
    </section>
  </div>

  <script src="./assets/app.js"></script>
</body>
</html>
